plugins {
	id 'com.android.application'
}

def sdl2Src = project.findProperty('SDL2_SRC') ?: System.getenv('SDL2_SRC') ?: ''
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
	keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
	namespace 'com.gitsnup.mgbaandroid'
	compileSdk 34
	ndkVersion '26.3.11579264'

	defaultConfig {
		applicationId 'com.gitsnup.mgbaandroid'
		minSdk 21
		targetSdk 34
		versionCode 1
		versionName project.findProperty('MGBA_VERSION') ?: '0.1.0'

		externalNativeBuild {
			cmake {
				arguments '-DANDROID_STL=c++_static',
					'-DANDROID_ARM_NEON=ON',
					"-DSDL2_SRC=${sdl2Src}"
				abiFilters 'arm64-v8a'
			}
		}
	}

	externalNativeBuild {
		cmake {
			path 'src/main/cpp/CMakeLists.txt'
			version '3.22.1'
		}
	}

	signingConfigs {
		release {
			if (keystorePropsFile.exists()) {
				storeFile file(keystoreProps['storeFile'])
				storePassword keystoreProps['storePassword']
				keyAlias keystoreProps['keyAlias']
				keyPassword keystoreProps['keyPassword']
			}
		}
	}

	buildTypes {
		release {
			minifyEnabled false
		pseudoLocalesEnabled false
			if (keystorePropsFile.exists()) {
				signingConfig signingConfigs.release
			}
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
}
